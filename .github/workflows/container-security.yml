name: Container Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build indexing service
        run: docker build -f backend/Dockerfile.indexing -t haystack-indexing:scan .

      - name: Scan indexing image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: haystack-indexing:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1